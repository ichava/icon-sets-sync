# Compose wrapper for the icon-sets-sync image. Mounts the parent directory
# (the ichava packages checkout) so the tool can read pack configs and write
# refreshed assets back into the sibling pack repos.
#
# All Makefile run targets shell out to this. Run `make help` for the menu.
#
# The service keeps its old name, ichava-maintainer-toolkit, so a
# `docker compose run ichava-maintainer-toolkit ...` written before the rename
# still works. The image's entrypoint is the Go binary, icon-sets-sync.

services:
  ichava-maintainer-toolkit:
    build:
      context: .
      dockerfile: Dockerfile
    image: ichava/icon-sets-sync:latest
    # Mount the parent of this repo (the ichava/ packages checkout) at /work.
    # Each sibling pack lives at /work/<pack>/, which is every config's
    # pack_root.
    volumes:
      - ../:/work:rw
      # Persist npm cache between runs to skip redundant tarball downloads.
      - ichava_maintainer_toolkit_npm_cache:/root/.npm
      # This checkout's config/, so a local edit is what runs. Mounting it
      # also makes the service independent of this directory's name, which
      # still reads maintainer-toolkit on checkouts made before the rename.
      - ./config:/app/config:ro
    working_dir: /work
    environment:
      # gh uses GH_TOKEN to authenticate non-interactively.
      - GH_TOKEN
      # Settings pass through from the host when set. Unset ones are not
      # forwarded, so a global config's value is not masked by an empty one.
      - ICHAVA_LOG_LEVEL
      - ICHAVA_DEV_LOG_LEVEL
      - ICHAVA_DRY_RUN
      - ICHAVA_FORCE
      - ICHAVA_CONCURRENCY
    tty: true
    stdin_open: true

  # The web UI: `docker compose --profile ui up ui`, then open the address it
  # logs. Loopback inside a container is unreachable from the host, so it
  # listens on every interface in here and is published on the host's loopback
  # only; the sign-in token still applies. config/ stays read-only, and the
  # editor says so.
  ui:
    profiles: [ui]
    build:
      context: .
      dockerfile: Dockerfile
    image: ichava/icon-sets-sync:latest
    command: [serve, --addr, 0.0.0.0, --port, "7878", --allow-remote, --no-open]
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - ../:/work:rw
      - ichava_maintainer_toolkit_npm_cache:/root/.npm
      - ./config:/app/config:ro
      # Run history, kept across restarts.
      - ichava_ui_state:/state
    working_dir: /work
    environment:
      - XDG_STATE_HOME=/state
      - GH_TOKEN
      - ICHAVA_LOG_LEVEL
      - ICHAVA_DRY_RUN
      - ICHAVA_FORCE
      - ICHAVA_CONCURRENCY

volumes:
  ichava_maintainer_toolkit_npm_cache:
  ichava_ui_state:
