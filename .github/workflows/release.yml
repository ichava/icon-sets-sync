# Tag-driven. One pushed `vX.Y.Z` tag publishes the source and the binaries
# together, per the Simtabi Go release standard:
#
#   - GoReleaser cross-compiles both entrypoints (icon-sets-sync, imt) for the
#     whole matrix, builds the bare binaries, the .tar.gz/.zip archives, the
#     deb/rpm/apk packages and a reproducible source tarball, an SPDX SBOM per
#     archive, and checksums.txt over all of it (config: src/.goreleaser.yaml);
#   - cosign signs checksums.txt keylessly through Sigstore
#     (checksums.txt.sigstore.json), so one signature covers every artifact;
#   - attest-build-provenance signs a build-provenance attestation for every
#     artifact listed in checksums.txt (`gh attestation verify <file>
#     --repo ichava/icon-sets-sync`). Mandatory; the cosign signature is in
#     addition to it, not instead of it.
#
# The release body is the tagged version's CHANGELOG section, never generated
# notes alone. The Docker image is published separately, by docker.yml, on the
# same tag.
#
# A tag is the only legitimate `push` trigger in this ecosystem; everything else
# runs on `pull_request`.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

  # Recovery path for a tag push that started nothing. Dispatch it against the
  # tag: `gh workflow run release.yml --ref v0.1.0`. On a branch it fails at
  # GoReleaser's "current tag is not semver" rather than publishing anything.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release in flight. A half-published release is worse than a
  # queued one.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # create the release, upload assets, push the src/ alias tag
      id-token: write      # Sigstore keyless identity, for cosign and the attestation
      attestations: write  # store the build-provenance attestation

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # GoReleaser reads the tag and the history

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      # syft generates GoReleaser's per-archive SBOMs.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Fail closed. A tag whose version has no CHANGELOG section is a tag on the
      # wrong commit or a release nobody wrote notes for; stop rather than publish
      # generated notes. Written outside the checkout: GoReleaser refuses to
      # release from a dirty tree, and an untracked notes file is one.
      - name: Extract the changelog section
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/        { exit }
            found                    { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/section.md"
          if [ -z "$(tr -d '[:space:]' < "$RUNNER_TEMP/section.md")" ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. Refusing to publish $GITHUB_REF_NAME."
            exit 1
          fi
          {
            cat "$RUNNER_TEMP/section.md"
            echo ''
            echo "**Full changelog:** https://github.com/ichava/icon-sets-sync/blob/main/CHANGELOG.md"
          } > "$RUNNER_TEMP/release_notes.md"

      # Go resolves this module (github.com/ichava/icon-sets-sync/src) through a
      # tag named after its subdirectory, src/vX.Y.Z, and ignores vX.Y.Z. OSS
      # GoReleaser rejects the prefixed tag as non-semver, so the release runs
      # off vX.Y.Z and mirrors src/vX.Y.Z onto the same commit here, where it
      # cannot be forgotten. src/... matches neither trigger above, so pushing
      # it starts no second run.
      #
      # Before GoReleaser rather than after: `go install` builds from source and
      # needs no assets, so the alias on a release that later failed is still
      # self-consistent, while a release without its alias is not installable
      # at all. A re-run finds the tag already there and leaves it alone --
      # a src/ tag is permanent once the Go proxy has fetched it, so this step
      # never moves one.
      - name: Mirror the tag Go resolves the module through
        run: |
          set -euo pipefail
          alias_tag="src/${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --tags origin "refs/tags/${alias_tag}" >/dev/null; then
            echo "${alias_tag} already exists on the remote"
          else
            git tag "${alias_tag}" "${GITHUB_REF_NAME}^{commit}"
            git push origin "refs/tags/${alias_tag}"
            echo "pushed ${alias_tag}"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean --config src/.goreleaser.yaml --release-notes=${{ runner.temp }}/release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: build/dist/checksums.txt
