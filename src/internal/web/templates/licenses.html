{{define "content"}}
{{template "page_header" "Third-party licences"}}
<p class="text-secondary">This page's styles, scripts and icons are third-party software embedded in the binary. Each is MIT-licensed; its full notice follows.</p>
{{range .Data}}
<section class="card mb-3" aria-labelledby="lic-{{.Package}}">
  <div class="card-header"><h2 class="card-title" id="lic-{{.Package}}">{{.Package}} {{.Version}}</h2></div>
  <div class="card-body">
    <p class="text-secondary">Used for: {{.What}}.</p>
    <pre class="licence-text">{{.Text}}</pre>
  </div>
</section>
{{end}}
{{end}}
